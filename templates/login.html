<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Expense Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo">
                    <span class="logo-icon">৳</span>
                </div>
                <h1>Expense Tracker</h1>
                <p>Track your daily expenses in BDT</p>
            </div>
            <form method="POST" class="login-form">
                {% if error %}
                <div class="alert alert-error">{{ error }}</div>
                {% endif %}
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autofocus placeholder="Enter username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Enter password">
                </div>
                <button type="submit" class="btn btn-primary btn-full">Sign In</button>
            </form>
            <div class="auth-links">
                <a href="{{ url_for('register') }}">Create an account</a>
                <span class="auth-sep">|</span>
                <a href="{{ url_for('forgot_password') }}">Forgot password?</a>
            </div>
        </div>
    </div>
    <footer class="app-footer">&copy; 2026 Expense Tracker by Joy Roy. All rights reserved.</footer>
</body>
</html>
