<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Expense Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo">
                    <span class="logo-icon">৳</span>
                </div>
                <h1>Set New Password</h1>
                <p>Choose a new password for your account</p>
            </div>
            {% if valid %}
            <form method="POST" class="login-form">
                {% if error %}
                <div class="alert alert-error">{{ error }}</div>
                {% endif %}
                <div class="form-group">
                    <label for="password">New Password</label>
                    <input type="password" id="password" name="password" required placeholder="At least 4 characters" minlength="4" autofocus>
                </div>
                <div class="form-group">
                    <label for="confirm">Confirm Password</label>
                    <input type="password" id="confirm" name="confirm" required placeholder="Repeat your password">
                </div>
                <button type="submit" class="btn btn-primary btn-full">Update Password</button>
            </form>
            {% else %}
            <div class="auth-links" style="text-align:center; padding:20px 0;">
                <div class="alert alert-error">{{ error }}</div>
                <a href="{{ url_for('forgot_password') }}">Request a new reset link</a>
            </div>
            {% endif %}
            <div class="auth-links">
                <a href="{{ url_for('login') }}">Back to Sign In</a>
            </div>
        </div>
    </div>
</body>
</html>
