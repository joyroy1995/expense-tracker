<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Expense Tracker</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' fill='%236366f1'>৳</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script>
      (function(){var t=localStorage.getItem('theme');if(t&&t!=='light')document.documentElement.setAttribute('data-theme',t);else if(!t&&window.matchMedia('(prefers-color-scheme:dark)').matches)document.documentElement.setAttribute('data-theme','dark');})();
      var THEMES=['','dark','oled-dark','sepia'],ICONS={'':'☀️','dark':'🌙','oled-dark':'🖤','sepia':'📜'},LABELS={'':'Light','dark':'Dark','oled-dark':'OLED','sepia':'Sepia'};
      function syncTheme(){var b=document.getElementById('themeToggle'),c=document.documentElement.getAttribute('data-theme')||'',i=ICONS[c]||'☀️',l=LABELS[c]||'Light';if(b){b.textContent=i+' '+l;var n=THEMES[(THEMES.indexOf(c)+1)%THEMES.length];b.title='Switch to '+(LABELS[n]||'Light')}}
      function toggleTheme(){var h=document.documentElement,c=h.getAttribute('data-theme')||'',n=THEMES[(THEMES.indexOf(c)+1)%THEMES.length];if(n){h.setAttribute('data-theme',n);localStorage.setItem('theme',n)}else{h.removeAttribute('data-theme');localStorage.setItem('theme','light')}syncTheme()}
      document.addEventListener('DOMContentLoaded',function(){syncTheme();document.getElementById('themeToggle')?.addEventListener('click',toggleTheme);});
    </script>
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo">
                    <span class="logo-icon">৳</span>
                </div>
                <h1>Forgot Password</h1>
                <p>Enter your username to reset your password</p>
            </div>
            <form method="POST" class="login-form">
                {% if error %}
                <div class="alert alert-error">{{ error }}</div>
                {% endif %}
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autofocus placeholder="Enter your username">
                </div>
                <button type="submit" class="btn btn-primary btn-full">Reset Password</button>
            </form>
            <div class="auth-links">
                <a href="{{ url_for('login') }}">Back to Sign In</a>
                <span class="auth-sep">|</span>
                <button id="themeToggle" class="theme-toggle-link" title="Switch theme">☀️ Light</button>
            </div>
        </div>
    </div>
    <footer class="app-footer">&copy; 2026 Expense Tracker by Joy Roy. All rights reserved.</footer>
</body>
</html>
