<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Expense Tracker</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' fill='%236366f1'>৳</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo">
                    <span class="logo-icon">৳</span>
                </div>
                <h1>Forgot Password</h1>
                <p>Enter your username to reset your password</p>
            </div>
            <form method="POST" class="login-form">
                {% if error %}
                <div class="alert alert-error">{{ error }}</div>
                {% endif %}
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autofocus placeholder="Enter your username">
                </div>
                <button type="submit" class="btn btn-primary btn-full">Reset Password</button>
            </form>
            <div class="auth-links">
                <a href="{{ url_for('login') }}">Back to Sign In</a>
            </div>
        </div>
    </div>
    <footer class="app-footer">&copy; 2026 Expense Tracker by Joy Roy. All rights reserved.</footer>
</body>
</html>
