<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' fill='%236366f1'>৳</text></svg>">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Expenses">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-180.png') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
      (function(){var t=localStorage.getItem('theme');if(t==='dark'||(!t&&window.matchMedia('(prefers-color-scheme:dark)').matches))document.documentElement.setAttribute('data-theme','dark');})();
    </script>
</head>
<body>
    <header class="topbar" id="topbar">
      <button class="menu-toggle" id="menuToggle">☰</button>
      <span class="topbar-title">Expense Tracker</span>
    </header>
    <nav id="sidebar" class="sidebar" style="display:none;">
        <div class="sidebar-header">
            <div class="sidebar-brand">
                <span class="logo-icon">৳</span>
                <span>Expense Tracker</span>
            </div>
            <button class="sidebar-toggle" id="sidebarToggle">‹</button>
        </div>
        <div class="sidebar-links">
            <a href="/" class="nav-link" data-link>Home</a>
            <a href="/dashboard" class="nav-link" data-link>Dashboard</a>
            <a href="/budgets" class="nav-link" data-link>Budgets</a>
            <a href="/profile" class="nav-link" data-link>Profile</a>
            <a href="/admin/users" class="nav-link" data-link id="adminLink" style="display:none;">Admin</a>
        </div>
        <div class="sidebar-footer">
            <button id="themeToggle" class="nav-link theme-toggle-sidebar" title="Toggle dark mode">🌙 Dark Mode</button>
            <button class="nav-link nav-logout" id="logoutBtn">🚪 Logout</button>
        </div>
    </nav>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div class="sidebar-tab" id="sidebarTab"></div>
    <main id="app" class="container"><div class="page-loader"><div class="spinner-lg"></div></div></main>
    <div id="toast" class="toast"></div>
    <footer class="app-footer">&copy; 2026 Expense Tracker by Joy Roy. All rights reserved.</footer>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/static/sw.js');
        });
      }
    </script>
</body>
</html>
