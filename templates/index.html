<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='logo.svg') }}">
    <link rel="mask-icon" href="{{ url_for('static', filename='logo.svg') }}" color="#6366f1">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Expenses">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-180.png') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ static_version }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
      (function(){var t=localStorage.getItem('theme');if(t&&t!=='light')document.documentElement.setAttribute('data-theme',t);else if(!t&&window.matchMedia('(prefers-color-scheme:dark)').matches)document.documentElement.setAttribute('data-theme','dark');})();
    </script>
</head>
<body>
    <header class="topbar" id="topbar">
      <button class="menu-toggle" id="menuToggle">☰</button>
      <span class="topbar-title">Expense Tracker</span>
    </header>
    <nav id="sidebar" class="sidebar" style="display:none;">
        <div class="sidebar-header">
            <div class="sidebar-brand">
                <span class="logo-icon">৳</span>
                <span>Expense Tracker</span>
            </div>
            <button class="sidebar-toggle" id="sidebarToggle">‹</button>
        </div>
        <div class="sidebar-links">
            <a href="/" class="nav-link" data-link title="Home"><span class="nav-icon">🏠</span> <span class="nav-label">Home</span></a>
            <a href="/dashboard" class="nav-link" data-link title="Dashboard"><span class="nav-icon">📊</span> <span class="nav-label">Dashboard</span></a>
            <a href="/calendar" class="nav-link" data-link title="Calendar"><span class="nav-icon">📅</span> <span class="nav-label">Calendar</span></a>
            <a href="/budgets" class="nav-link" data-link title="Budgets"><span class="nav-icon">💰</span> <span class="nav-label">Budgets</span></a>
            <a href="/recurring" class="nav-link" data-link title="Recurring"><span class="nav-icon">🔄</span> <span class="nav-label">Recurring</span></a>
            <a href="/profile" class="nav-link" data-link title="Profile"><span class="nav-icon">👤</span> <span class="nav-label">Profile</span></a>
            <a href="/admin/users" class="nav-link" data-link id="adminLink" style="display:none;" title="Admin"><span class="nav-icon">⚙️</span> <span class="nav-label">Admin</span></a>
            <a href="/admin/notifications" class="nav-link" data-link id="adminNotifLink" style="display:none;" title="Digest"><span class="nav-icon">📨</span> <span class="nav-label">Digest</span></a>
        </div>
        <div class="sidebar-footer">
            <button id="themeToggle" class="nav-link theme-toggle-sidebar" title="Switch theme"><span class="nav-icon">☀️</span> <span class="nav-label">Light</span></button>
            <button class="nav-link nav-logout" id="logoutBtn" title="Logout"><span class="nav-icon">🚪</span> <span class="nav-label">Logout</span></button>
        </div>
    </nav>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div class="sidebar-tab" id="sidebarTab"></div>
    <main id="app" class="container"><div class="page-loader"><div class="spinner-lg"></div></div></main>
    <div id="toast" class="toast"></div>
    <footer class="app-footer">&copy; 2026 Expense Tracker by Joy Roy. All rights reserved.</footer>
    <script src="{{ url_for('static', filename='script.js') }}?v={{ static_version }}"></script>
</body>
</html>
